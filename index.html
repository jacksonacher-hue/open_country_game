<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Verification Demo</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
  }
  h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: #64748b; margin-bottom: 24px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    background: #0f1117;
    border: 1px solid #2d3148;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #6366f1; }
  .btn-row { display: flex; gap: 8px; margin-top: 4px; }
  button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-signup { background: #6366f1; color: #fff; }
  .btn-login  { background: #1e293b; color: #e2e8f0; border: 1px solid #2d3148; }
  .btn-resend { background: transparent; color: #94a3b8; border: 1px solid #2d3148; font-size: 12px; margin-top: 10px; width: 100%; flex: none; }
  .btn-logout { background: transparent; color: #f87171; border: 1px solid #3d1f1f; font-size: 12px; margin-top: 12px; width: 100%; }
  .msg {
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    display: none;
  }
  .msg.success { background: #0d2e1a; border: 1px solid #16a34a; color: #4ade80; display: block; }
  .msg.error   { background: #2e0d0d; border: 1px solid #dc2626; color: #f87171; display: block; }
  .msg.info    { background: #0d1a2e; border: 1px solid #3b82f6; color: #93c5fd; display: block; }
  .log {
    margin-top: 20px;
    background: #0f1117;
    border: 1px solid #2d3148;
    border-radius: 8px;
    padding: 12px;
    font-size: 11px;
    font-family: monospace;
    color: #64748b;
    max-height: 180px;
    overflow-y: auto;
    line-height: 1.7;
  }
  .log .ok  { color: #4ade80; }
  .log .err { color: #f87171; }
  .log .inf { color: #93c5fd; }
  #loggedInView { display: none; }
  .verified-badge {
    display: inline-block;
    background: #0d2e1a;
    border: 1px solid #16a34a;
    color: #4ade80;
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 700;
    margin-left: 8px;
  }
  .unverified-badge {
    display: inline-block;
    background: #2e1a0d;
    border: 1px solid #d97706;
    color: #fbbf24;
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 700;
    margin-left: 8px;
  }
  .user-email { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .divider { border: none; border-top: 1px solid #2d3148; margin: 20px 0; }
</style>
</head>
<body>

<div class="card">
  <h2>Email Verification Demo</h2>
  <p class="subtitle">Using Firebase Auth compat SDK (same as your app)</p>

  <!-- Auth form -->
  <div id="authView">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="min 6 characters">

    <div class="btn-row">
      <button class="btn-signup" id="signupBtn">Sign Up</button>
      <button class="btn-login"  id="loginBtn">Log In</button>
    </div>
    <button class="btn-resend" id="resendBtn" style="display:none">↺ Resend verification email</button>

    <div class="msg" id="msg"></div>
  </div>

  <!-- Logged-in view -->
  <div id="loggedInView">
    <div class="user-email" id="userEmailDisplay"></div>
    <div id="verifiedStatus"></div>
    <hr class="divider">
    <div style="font-size:12px;color:#64748b;line-height:1.6;">
      If not yet verified, click "Resend" below, check your inbox, click the link, then come back and refresh.
    </div>
    <button class="btn-resend" id="resendBtnLoggedIn" style="display:block;margin-top:12px;">↺ Resend verification email</button>
    <button class="btn-logout" id="logoutBtn">Sign Out</button>
  </div>

  <!-- Debug log -->
  <div class="log" id="log"><span class="inf">— log output will appear here —</span></div>
</div>

<script>
  // ── YOUR FIREBASE CONFIG (same project as main app) ──────────
  const firebaseConfig = {
    apiKey: "AIzaSyD2CR7kVcvDBpQXW0E2-_XYK6zbtsvy9_w",
    authDomain: "open-country-game.firebaseapp.com",
    projectId: "open-country-game",
    storageBucket: "open-country-game.firebasestorage.app",
    messagingSenderId: "6313677807",
    appId: "1:6313677807:web:9f98a0a50cb8d40a4b5c1a"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // ── Helpers ──────────────────────────────────────────────────
  const logEl = document.getElementById('log');
  function log(text, type = 'inf') {
    const line = document.createElement('div');
    line.className = type;
    line.textContent = new Date().toLocaleTimeString() + '  ' + text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    // Also log to console
    console.log('[DEMO]', text);
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  function clearMsg() {
    const el = document.getElementById('msg');
    el.className = 'msg';
    el.textContent = '';
  }

  // ── Suppress onAuthStateChanged firing during signup ─────────
  let suppressAuth = false;

  // ── onAuthStateChanged ───────────────────────────────────────
  auth.onAuthStateChanged(user => {
    if (suppressAuth) {
      log('onAuthStateChanged fired but suppressed (signup in progress)', 'inf');
      return;
    }
    if (user) {
      log('onAuthStateChanged: signed in as ' + user.email + ' | verified=' + user.emailVerified, 'ok');
      showLoggedIn(user);
    } else {
      log('onAuthStateChanged: signed out', 'inf');
      document.getElementById('authView').style.display = 'block';
      document.getElementById('loggedInView').style.display = 'none';
    }
  });

  // ── Show logged-in panel ──────────────────────────────────────
  function showLoggedIn(user) {
    document.getElementById('authView').style.display = 'none';
    document.getElementById('loggedInView').style.display = 'block';
    document.getElementById('userEmailDisplay').textContent = user.email;
    document.getElementById('verifiedStatus').innerHTML = user.emailVerified
      ? '<span class="verified-badge">✓ Email verified</span>'
      : '<span class="unverified-badge">⚠ Not yet verified</span>';
    document.getElementById('resendBtnLoggedIn').style.display = user.emailVerified ? 'none' : 'block';
  }

  // ── Sign Up ──────────────────────────────────────────────────
  document.getElementById('signupBtn').addEventListener('click', async () => {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) { showMsg('Enter email and password.', 'error'); return; }

    clearMsg();
    log('Attempting sign up for ' + email + '…', 'inf');

    suppressAuth = true; // stop onAuthStateChanged from logging user in
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      log('Account created: ' + cred.user.uid, 'ok');

      // Send verification email BEFORE signing out
      log('Calling sendEmailVerification()…', 'inf');
      await cred.user.sendEmailVerification();
      log('sendEmailVerification() resolved — email sent!', 'ok');

      await auth.signOut();
      log('Signed out after signup.', 'inf');

      suppressAuth = false;
      showMsg('✉ Verification email sent to ' + email + '. Check your inbox, click the link, then log in.', 'success');
      document.getElementById('resendBtn').style.display = 'block';

    } catch (err) {
      suppressAuth = false;
      log('ERROR: ' + err.code + ' — ' + err.message, 'err');
      showMsg(err.message, 'error');
      try { await auth.signOut(); } catch(e) {}
    }
  });

  // ── Log In ───────────────────────────────────────────────────
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) { showMsg('Enter email and password.', 'error'); return; }

    clearMsg();
    log('Attempting login for ' + email + '…', 'inf');
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      log('Signed in. emailVerified=' + cred.user.emailVerified, 'ok');
      // onAuthStateChanged will handle the UI update
    } catch (err) {
      log('Login ERROR: ' + err.code + ' — ' + err.message, 'err');
      showMsg(err.message, 'error');
    }
  });

  // ── Resend (from auth form, before login) ────────────────────
  document.getElementById('resendBtn').addEventListener('click', async () => {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) { showMsg('Enter your email and password to resend.', 'error'); return; }

    log('Resending: signing in temporarily…', 'inf');
    suppressAuth = true;
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      if (cred.user.emailVerified) {
        suppressAuth = false;
        showMsg('Your email is already verified — just log in!', 'success');
        await auth.signOut();
        return;
      }
      await cred.user.sendEmailVerification();
      log('Resend: sendEmailVerification() resolved.', 'ok');
      await auth.signOut();
      suppressAuth = false;
      showMsg('Verification email resent to ' + email + '.', 'success');
    } catch (err) {
      suppressAuth = false;
      log('Resend ERROR: ' + err.code + ' — ' + err.message, 'err');
      showMsg(err.message, 'error');
      try { await auth.signOut(); } catch(e) {}
    }
  });

  // ── Resend (from logged-in panel) ────────────────────────────
  document.getElementById('resendBtnLoggedIn').addEventListener('click', async () => {
    const user = auth.currentUser;
    if (!user) return;
    log('Resending verification email for ' + user.email + '…', 'inf');
    try {
      await user.sendEmailVerification();
      log('sendEmailVerification() resolved.', 'ok');
      showLoggedIn(user); // refresh badge
    } catch (err) {
      log('Resend ERROR: ' + err.code + ' — ' + err.message, 'err');
    }
  });

  // ── Log Out ──────────────────────────────────────────────────
  document.getElementById('logoutBtn').addEventListener('click', () => {
    auth.signOut();
  });
</script>
</body>
</html>
